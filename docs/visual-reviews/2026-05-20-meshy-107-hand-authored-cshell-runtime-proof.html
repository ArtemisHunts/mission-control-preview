<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meshy-107 Runtime Proof</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080a0e;
      color: #dfe7df;
      font-family: Inter, system-ui, sans-serif;
    }

    #proof {
      width: 100vw;
      height: 100vh;
    }

    .label {
      position: fixed;
      left: 24px;
      bottom: 22px;
      padding: 10px 13px;
      background: rgba(4, 6, 9, 0.72);
      border: 1px solid rgba(174, 207, 196, 0.28);
      font-size: 13px;
      letter-spacing: 0.02em;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="proof"></div>
  <div class="label">Meshy-107 hand-authored C-shell · browser GLB proof · not final art</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const mount = document.getElementById('proof');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080a0e);

    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(5.0, -7.6, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    mount.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xe8f4ff, 0x24170f, 1.5);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xffffff, 4.5);
    key.position.set(4.5, -6.2, 6.0);
    scene.add(key);
    const rim = new THREE.PointLight(0x80c8ff, 14, 28);
    rim.position.set(-4.0, 3.8, 3.4);
    scene.add(rim);

    const group = new THREE.Group();
    scene.add(group);

    function fit(model) {
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      model.position.sub(center);
      const scale = 4.9 / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(scale);
      model.rotation.set(THREE.MathUtils.degToRad(62), 0, THREE.MathUtils.degToRad(-14));
      camera.lookAt(0, 0, 0);
    }

    new GLTFLoader().load('/assets/blender/meshy-107-hand-authored-cshell-baseline-v1.glb', (gltf) => {
      const model = gltf.scene;
      model.traverse((node) => {
        if (!node.isMesh) return;
        node.frustumCulled = false;
        node.material = new THREE.MeshStandardMaterial({
          color: 0x6d665d,
          roughness: 0.86,
          metalness: 0,
          emissive: 0x15120e,
          emissiveIntensity: 0.12,
          side: THREE.DoubleSide
        });
      });
      group.add(model);
      fit(model);
      renderer.render(scene, camera);
    });

    function tick() {
      group.rotation.z += 0.0015;
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
