<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meshy-108 Facility Contact Audit Pass 1 Browser Smoke</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #04070c;
      color: #e8fbff;
      font-family: Inter, system-ui, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .readout {
      position: fixed;
      left: 18px;
      bottom: 16px;
      max-width: min(860px, calc(100vw - 36px));
      padding: 10px 12px;
      border: 1px solid rgba(111, 231, 255, 0.36);
      background: rgba(3, 9, 16, 0.82);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <canvas id="stage" width="1600" height="1000"></canvas>
  <div class="readout" id="readout">Loading Meshy-108 facility contact audit GLB</div>
  <script>
    const GLB_URL = '../../assets/blender/meshy-108-facility-contact-audit-pass1.glb';
    const roles = [
      ['COMMAND', -0.18, -0.22, '+0.0492', '1.0', '#64e8ff'],
      ['HANGAR', -0.46, 0.22, '-0.0242', '1.0', '#ffbd59'],
      ['PRODUCTION', 0.38, 0.26, '-0.2505', '1.0', '#ffbd59'],
      ['POWER', 0.43, -0.16, '-0.2330', '1.0', '#55f0a0'],
      ['LOGISTICS', -0.32, 0.48, '-0.0693', '1.0', '#ffbd59'],
      ['CATWALK', 0.02, 0.08, '-0.0475', '1.0', '#64e8ff'],
      ['SIGNAL', 0.55, -0.48, '-0.1747', '1.0', '#64e8ff'],
      ['CONTROL', -0.6, -0.34, '-0.0336', '1.0', '#55f0a0']
    ];

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const readout = document.getElementById('readout');

    function drawSmoke(status, detail) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      const grad = ctx.createRadialGradient(w * 0.48, h * 0.45, 40, w * 0.52, h * 0.52, w * 0.82);
      grad.addColorStop(0, '#162331');
      grad.addColorStop(0.56, '#07111c');
      grad.addColorStop(1, '#010308');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.translate(w * 0.5, h * 0.5);

      ctx.lineWidth = 42;
      ctx.strokeStyle = '#71656b';
      ctx.beginPath();
      ctx.ellipse(0, -8, 476, 318, -0.08, Math.PI * 0.18, Math.PI * 1.73);
      ctx.stroke();

      ctx.lineWidth = 10;
      ctx.strokeStyle = '#b9977d';
      ctx.beginPath();
      ctx.ellipse(0, -8, 522, 362, -0.08, Math.PI * 0.2, Math.PI * 1.69);
      ctx.stroke();

      ctx.strokeStyle = '#101723';
      ctx.lineWidth = 82;
      ctx.beginPath();
      ctx.arc(300, -234, 136, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(5, 11, 18, 0.75)';
      ctx.beginPath();
      ctx.ellipse(0, 22, 318, 190, -0.04, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#6fe7ff';
      ctx.lineWidth = 3;
      ctx.setLineDash([12, 10]);
      ctx.strokeRect(-384, -226, 768, 452);
      ctx.setLineDash([]);

      roles.forEach(([label, x, y, gap, overlap, color]) => {
        const px = x * 540;
        const py = y * 424;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(px - 86, py - 42, 172, 76);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.strokeRect(px - 86, py - 42, 172, 76);

        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 14;
        ctx.fillRect(px - 42, py - 6, 84, 16);
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#eafcff';
        ctx.font = 'bold 18px Inter, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(label, px, py - 20);
        ctx.font = '13px Inter, system-ui, sans-serif';
        ctx.fillStyle = '#c5f2ff';
        ctx.fillText('gap ' + gap + ' / overlap ' + overlap, px, py + 26);
      });

      ctx.fillStyle = '#eafcff';
      ctx.font = 'bold 30px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Meshy-108 Facility Contact Audit Pass 1', 0, -410);
      ctx.font = '18px Inter, system-ui, sans-serif';
      ctx.fillStyle = '#9fd5df';
      ctx.fillText('Browser GLB fetch/parse smoke with accepted 8-role contact schematic', 0, -374);
      ctx.fillText('Accepted gap range -0.2505 to +0.0492; XY overlap 1.0 on all role mounts', 0, 372);
      ctx.restore();

      readout.textContent = status + ' / ' + detail;
    }

    async function load() {
      const response = await fetch(GLB_URL, { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const buffer = await response.arrayBuffer();
      const view = new DataView(buffer);
      const magic = String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2), view.getUint8(3));
      const version = view.getUint32(4, true);
      const length = view.getUint32(8, true);
      if (magic !== 'glTF' || version !== 2 || length !== buffer.byteLength) {
        throw new Error('Invalid GLB header');
      }
      window.__M108_CONTACT_AUDIT_LOADED = true;
      window.__M108_CONTACT_AUDIT_BYTES = buffer.byteLength;
      drawSmoke('Loaded audit GLB ' + Math.round(buffer.byteLength / 1024) + ' KB', 'glTF ' + version + ' / 8 accepted contact roles');
    }

    load().catch((error) => {
      window.__M108_CONTACT_AUDIT_ERROR = String(error && error.message || error);
      drawSmoke('Failed', window.__M108_CONTACT_AUDIT_ERROR);
    });
  </script>
</body>
</html>
