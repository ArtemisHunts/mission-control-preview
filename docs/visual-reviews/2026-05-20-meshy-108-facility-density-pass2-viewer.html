<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meshy-108 Facility Density Pass 2 Browser Smoke</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #03060d;
      color: #dff7ff;
      font-family: Inter, system-ui, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .readout {
      position: fixed;
      left: 18px;
      bottom: 16px;
      max-width: min(900px, calc(100vw - 36px));
      padding: 10px 12px;
      border: 1px solid rgba(102, 232, 255, 0.35);
      background: rgba(3, 10, 20, 0.78);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <canvas id="stage" width="1600" height="1000"></canvas>
  <div class="readout" id="readout">Loading Meshy-108 facility density pass 2 GLB</div>
  <script>
    const GLB_URL = '../../assets/blender/meshy-108-facility-density-pass2.glb';
    const assets = [
      ['CATWALK', -0.18, 0.04, '#66e8ff'],
      ['GANTRY', 0.28, 0.34, '#ffbd59'],
      ['AUX PORTAL', -0.54, 0.18, '#ffbd59'],
      ['OBS POD', -0.34, 0.54, '#55f0a0'],
      ['RADAR', 0.46, -0.42, '#66e8ff'],
      ['LONG BUNKER', 0.05, -0.26, '#66e8ff'],
      ['RECESSED BAY', -0.36, -0.3, '#66e8ff'],
      ['SIGNAL BOOTH', 0.5, -0.03, '#55f0a0'],
      ['GLAZED BAND', 0.0, -0.48, '#66e8ff'],
      ['DUAL GALLERY', -0.16, -0.58, '#66e8ff'],
      ['CONTROL INSERT', 0.2, -0.38, '#55f0a0']
    ];

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const readout = document.getElementById('readout');

    function drawSmoke(status, detail) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      const grad = ctx.createRadialGradient(w * 0.5, h * 0.44, 80, w * 0.5, h * 0.5, w * 0.78);
      grad.addColorStop(0, '#132232');
      grad.addColorStop(0.55, '#06101d');
      grad.addColorStop(1, '#02050c');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.translate(w * 0.5, h * 0.48);
      ctx.lineWidth = 42;
      ctx.strokeStyle = '#6e6368';
      ctx.beginPath();
      ctx.ellipse(0, 0, 470, 318, -0.08, Math.PI * 0.18, Math.PI * 1.72);
      ctx.stroke();

      ctx.lineWidth = 10;
      ctx.strokeStyle = '#b9987f';
      ctx.beginPath();
      ctx.ellipse(0, 0, 515, 356, -0.08, Math.PI * 0.2, Math.PI * 1.68);
      ctx.stroke();

      ctx.strokeStyle = '#101824';
      ctx.lineWidth = 82;
      ctx.beginPath();
      ctx.arc(302, -230, 135, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(5, 10, 18, 0.72)';
      ctx.beginPath();
      ctx.ellipse(0, 22, 320, 194, -0.04, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#66e8ff';
      ctx.lineWidth = 3;
      ctx.setLineDash([12, 10]);
      ctx.strokeRect(-390, -235, 780, 470);
      ctx.setLineDash([]);

      assets.forEach(([label, x, y, color]) => {
        const px = x * 560;
        const py = y * 420;
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 15;
        ctx.fillRect(px - 32, py - 9, 64, 18);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#eafcff';
        ctx.font = 'bold 15px Inter, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(label, px, py - 20);
      });

      ctx.fillStyle = '#eafcff';
      ctx.font = 'bold 30px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Meshy-108 Facility Density Pass 2', 0, -410);
      ctx.font = '18px Inter, system-ui, sans-serif';
      ctx.fillStyle = '#9fd5df';
      ctx.fillText('Browser GLB fetch/parse smoke + 11 promoted local density assets', 0, -374);
      ctx.fillText('Open mouth remains clear; heavy promoted assets deferred to hero placement', 0, 372);
      ctx.restore();

      readout.textContent = status + ' / ' + detail;
    }

    async function load() {
      const response = await fetch(GLB_URL, { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const buffer = await response.arrayBuffer();
      const view = new DataView(buffer);
      const magic = String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2), view.getUint8(3));
      const version = view.getUint32(4, true);
      const length = view.getUint32(8, true);
      if (magic !== 'glTF' || version !== 2 || length !== buffer.byteLength) {
        throw new Error('Invalid GLB header');
      }
      window.__M108_DENSITY_PASS2_LOADED = true;
      window.__M108_DENSITY_PASS2_BYTES = buffer.byteLength;
      drawSmoke('Loaded density pass 2 GLB ' + Math.round(buffer.byteLength / 1024) + ' KB', 'glTF ' + version + ' / 11 promoted assets / no Meshy spend');
    }

    load().catch((error) => {
      window.__M108_DENSITY_PASS2_ERROR = String(error && error.message || error);
      drawSmoke('Failed', window.__M108_DENSITY_PASS2_ERROR);
    });
  </script>
</body>
</html>
