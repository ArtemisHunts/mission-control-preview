<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meshy-108 Facility Population Pass 1 Browser Smoke</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #03060d;
      color: #dff7ff;
      font-family: Inter, system-ui, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .readout {
      position: fixed;
      left: 18px;
      bottom: 16px;
      max-width: min(760px, calc(100vw - 36px));
      padding: 10px 12px;
      border: 1px solid rgba(102, 232, 255, 0.35);
      background: rgba(3, 10, 20, 0.78);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <canvas id="stage" width="1600" height="1000"></canvas>
  <div class="readout" id="readout">Loading Meshy-108 facility population pass 1 GLB</div>
  <script>
    const GLB_URL = '../../assets/blender/meshy-108-facility-population-pass1.glb';
    const roles = [
      ['COMMAND', -0.18, -0.22, '#66e8ff'],
      ['HANGAR', -0.46, 0.22, '#ffbd59'],
      ['PRODUCTION', 0.38, 0.26, '#ffbd59'],
      ['POWER', 0.43, -0.16, '#55f0a0'],
      ['LOGISTICS', -0.32, 0.48, '#ffbd59'],
      ['CATWALK', 0.02, 0.08, '#66e8ff'],
      ['SIGNAL', 0.55, -0.48, '#66e8ff'],
      ['CONTROL', -0.6, -0.34, '#55f0a0']
    ];

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const readout = document.getElementById('readout');

    function drawSmoke(status, detail) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      const grad = ctx.createRadialGradient(w * 0.5, h * 0.45, 80, w * 0.5, h * 0.5, w * 0.75);
      grad.addColorStop(0, '#122032');
      grad.addColorStop(0.55, '#06101d');
      grad.addColorStop(1, '#02050c');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.translate(w * 0.5, h * 0.48);
      ctx.lineWidth = 38;
      ctx.strokeStyle = '#6e6368';
      ctx.beginPath();
      ctx.ellipse(0, 0, 460, 315, -0.08, Math.PI * 0.18, Math.PI * 1.72);
      ctx.stroke();

      ctx.lineWidth = 10;
      ctx.strokeStyle = '#b9987f';
      ctx.beginPath();
      ctx.ellipse(0, 0, 505, 352, -0.08, Math.PI * 0.2, Math.PI * 1.68);
      ctx.stroke();

      ctx.strokeStyle = '#101824';
      ctx.lineWidth = 80;
      ctx.beginPath();
      ctx.arc(292, -222, 132, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(5, 10, 18, 0.72)';
      ctx.beginPath();
      ctx.ellipse(0, 20, 310, 185, -0.04, 0, Math.PI * 2);
      ctx.fill();

      roles.forEach(([label, x, y, color]) => {
        const px = x * 520;
        const py = y * 420;
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 18;
        ctx.fillRect(px - 38, py - 12, 76, 24);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#eafcff';
        ctx.font = 'bold 18px Inter, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(label, px, py - 24);
      });

      ctx.strokeStyle = '#66e8ff';
      ctx.lineWidth = 3;
      ctx.setLineDash([12, 10]);
      ctx.strokeRect(-368, -210, 736, 420);
      ctx.setLineDash([]);

      ctx.fillStyle = '#eafcff';
      ctx.font = 'bold 30px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Meshy-108 Facility Population Pass 1', 0, -390);
      ctx.font = '18px Inter, system-ui, sans-serif';
      ctx.fillStyle = '#9fd5df';
      ctx.fillText('Browser GLB fetch/parse smoke + role placement schematic', 0, -354);
      ctx.fillText('Open mouth kept clear in upper-right quadrant', 0, 348);
      ctx.restore();

      readout.textContent = status + ' / ' + detail;
    }

    async function load() {
      const response = await fetch(GLB_URL, { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const buffer = await response.arrayBuffer();
      const view = new DataView(buffer);
      const magic = String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2), view.getUint8(3));
      const version = view.getUint32(4, true);
      const length = view.getUint32(8, true);
      if (magic !== 'glTF' || version !== 2 || length !== buffer.byteLength) {
        throw new Error('Invalid GLB header');
      }
      window.__M108_PASS1_LOADED = true;
      window.__M108_PASS1_BYTES = buffer.byteLength;
      drawSmoke('Loaded GLB ' + Math.round(buffer.byteLength / 1024) + ' KB', 'glTF ' + version + ' / 8 facility roles / accepted baseline');
    }

    load().catch((error) => {
      window.__M108_PASS1_ERROR = String(error && error.message || error);
      drawSmoke('Failed', window.__M108_PASS1_ERROR);
    });
  </script>
</body>
</html>
