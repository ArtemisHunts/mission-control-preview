<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Control // Environment Prototype</title>
  <meta name="description" content="ArtemisHunts Mission Control — a browser-native 3D asteroid-base environment prototype." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="office-canvas" aria-label="3D asteroid-base Mission Control environment"></div>

  <main class="environment-shell" aria-label="Environment navigation">
    <div class="room-readout" id="room-readout">
      <span class="readout-kicker">ASTEROID BASE</span>
      <strong id="focus-title">Environment Overview</strong>
      <span id="focus-body">WASD / arrow keys pan the fixed facility view. Click the floor to traverse; click rooms or use the dock to focus a bay.</span>
    </div>


    <aside class="zoom-panel glass-panel" aria-label="Camera zoom controls">
      <span id="zoom-readout">FULL · 28.1m</span>
      <div class="zoom-row">
        <button class="zoom-button active" data-camera-preset="full">Full</button>
        <button class="zoom-button" data-camera-preset="wide">Wide</button>
        <button class="zoom-button" data-camera-preset="detail">Detail</button>
        <button class="zoom-button" data-camera-preset="ceiling">Ceiling</button>
      </div>
      <div class="zoom-row compact">
        <button class="zoom-button" id="zoom-out-btn">−</button>
        <button class="zoom-button" id="zoom-in-btn">+</button>
      </div>
    </aside>

    <footer class="bottom-dock glass-panel">
      <button class="dock-button active" data-mode="overview">Overview</button>
      <button class="dock-button" data-mode="command">Command Center</button>
      <button class="dock-button" data-mode="build">Build</button>
      <button class="dock-button" data-mode="review">Review</button>
      <button class="dock-button" data-mode="deploy">Deploy</button>
      <button class="dock-button" data-mode="observatory">Observatory</button>
      <button class="dock-button" id="shuffle-btn">Shift</button>
    </footer>
  </main>

  <button class="console-hotspot" id="console-hotspot" type="button" aria-label="Open Command Center">
    <span></span>
  </button>

  <section class="mission-console" id="mission-console" aria-label="Command Center" aria-hidden="true">
    <div class="console-backdrop" id="console-backdrop"></div>
    <div class="console-surface glass-panel" role="dialog" aria-modal="true" aria-labelledby="console-title">
      <header class="console-header">
        <div>
          <span class="console-kicker" id="console-kicker">CANONICAL STATE</span>
          <h2 id="console-title">Mission Control</h2>
        </div>
        <button class="console-close" id="console-close" type="button" aria-label="Close command console">×</button>
      </header>
      <nav class="console-tabs" id="console-tabs" aria-label="Mission console panels"></nav>
      <div class="console-grid" id="console-grid"></div>
    </div>
  </section>

  <div class="vignette"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="app.js?v=mission-control-state-console-20260518"></script>
</body>
</html>
